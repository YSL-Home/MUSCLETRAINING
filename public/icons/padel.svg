<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Paddle head (rounded rectangle, like a padel racket) -->
  <rect x="4" y="2" width="24" height="18" rx="9" fill="#C9A84C"/>
  <!-- Holes on the paddle face -->
  <circle cx="10" cy="7" r="1.5" fill="#07070F" opacity="0.55"/>
  <circle cx="16" cy="7" r="1.5" fill="#07070F" opacity="0.55"/>
  <circle cx="22" cy="7" r="1.5" fill="#07070F" opacity="0.55"/>
  <circle cx="10" cy="12" r="1.5" fill="#07070F" opacity="0.55"/>
  <circle cx="16" cy="12" r="1.5" fill="#07070F" opacity="0.55"/>
  <circle cx="22" cy="12" r="1.5" fill="#07070F" opacity="0.55"/>
  <circle cx="13" cy="17" r="1.5" fill="#07070F" opacity="0.55"/>
  <circle cx="19" cy="17" r="1.5" fill="#07070F" opacity="0.55"/>
  <!-- Handle -->
  <rect x="13" y="20" width="6" height="9" rx="3" fill="#C9A84C"/>
  <!-- Handle grip lines -->
  <line x1="14" y1="23" x2="18" y2="23" stroke="#07070F" stroke-width="1" opacity="0.35"/>
  <line x1="14" y1="26" x2="18" y2="26" stroke="#07070F" stroke-width="1" opacity="0.35"/>
</svg>
