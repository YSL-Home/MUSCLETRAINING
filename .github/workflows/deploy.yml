name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: musclefr-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (next export → out/)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        run: |
          npx wrangler@4 pages deploy out/ \
            --project-name=muscletraining \
            --commit-dirty=true \
            --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ping IndexNow (Bing/Yandex)
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs
        continue-on-error: true

      - name: Déployer le Bot Telegram (Cloudflare Worker)
        if: env.CF_API_TOKEN != ''
        run: |
          echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | npx wrangler@4 secret put TELEGRAM_BOT_TOKEN \
            --config workers/wrangler-bot.toml --name muscletraining-bot 2>/dev/null || true
          npx wrangler@4 deploy workers/telegram-bot.js \
            --config workers/wrangler-bot.toml \
            --name muscletraining-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
