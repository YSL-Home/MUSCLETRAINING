name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: musclefr-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (next export → out/)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_AD_SLOT_EX_VIDEO: ${{ secrets.AD_SLOT_EX_VIDEO }}
          NEXT_PUBLIC_AD_SLOT_EX_SIDEBAR: ${{ secrets.AD_SLOT_EX_SIDEBAR }}
          NEXT_PUBLIC_AD_SLOT_BLOG_MID: ${{ secrets.AD_SLOT_BLOG_MID }}
          NEXT_PUBLIC_AD_SLOT_BLOG_BAS: ${{ secrets.AD_SLOT_BLOG_BAS }}

      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        run: |
          npx wrangler@4 pages deploy out/ \
            --project-name=muscletraining \
            --commit-dirty=true \
            --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ping IndexNow (Bing/Yandex)
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs
        continue-on-error: true

      - name: Déployer le Bot Telegram (Cloudflare Worker)
        if: env.CF_API_TOKEN != ''
        id: deploy_bot
        run: |
          # Injecte le secret bot dans le Worker
          echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | npx wrangler@4 secret put TELEGRAM_BOT_TOKEN \
            --config workers/wrangler-bot.toml --name muscletraining-bot 2>/dev/null || true
          # Déploie et capture l'URL
          DEPLOY_OUT=$(npx wrangler@4 deploy workers/telegram-bot.js \
            --config workers/wrangler-bot.toml --name muscletraining-bot 2>&1)
          echo "$DEPLOY_OUT"
          BOT_URL=$(echo "$DEPLOY_OUT" | grep -oE 'https://muscletraining-bot\.[^ ]+workers\.dev' | head -1)
          echo "bot_url=$BOT_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Enregistrer webhook Telegram → Worker
        if: steps.deploy_bot.outputs.bot_url != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${{ steps.deploy_bot.outputs.bot_url }}\", \"allowed_updates\": [\"message\",\"callback_query\"]}" | jq .
        continue-on-error: true
