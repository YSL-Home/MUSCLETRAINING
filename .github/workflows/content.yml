name: Moteur de contenu hebdo

on:
  schedule:
    - cron: '0 8 * * 1' # tous les lundis à 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: musclefr-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Générer un article
        run: node scripts/generate-article.mjs
        env:
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

      - name: Commit & push
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/generated-articles.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/generated-articles.json
            git commit -m "📝 Nouvel article auto (moteur de contenu hebdo)"
            git push
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun nouvel article."
          fi

      # Les pushs via GITHUB_TOKEN ne déclenchent pas d'autres workflows :
      # on lance donc explicitement le déploiement puis l'auto-post social.
      - name: Déclencher déploiement + social
        if: steps.commit.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          sleep 90
          gh workflow run social.yml --ref main
