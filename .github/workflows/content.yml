name: Moteur de contenu

on:
  schedule:
    - cron: '0 8 * * 1,3,5' # lundi, mercredi, vendredi à 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: musclefr-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer ffmpeg + polices (pour les Reels)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Générer un article
        run: node scripts/generate-article.mjs
        env:
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

      - name: Installer dépendances (sharp pour le Reel)
        run: npm ci

      - name: Générer le Reel vertical (TikTok/Reels/Shorts)
        run: node scripts/make-reel.mjs
        continue-on-error: true

      - name: Générer + poster le carrousel programme (rotation)
        run: node scripts/make-carousel.mjs
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Régénérer le PDF du programme du jour (réutilise les images du carrousel)
        run: node scripts/make-pdf.mjs
        continue-on-error: true
        env:
          PROG_INDEX: ${{ github.run_number }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIN_PDF: '1'

      - name: Upload YouTube Short (Reel → Shorts)
        run: node scripts/youtube-upload.mjs
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      - name: Commit & push
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/generated-articles.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/generated-articles.json public/blog/ public/reels/ public/downloads/
            git commit -m "📝 Nouvel article auto + Reel (moteur de contenu hebdo)"
            git push
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun nouvel article."
          fi

      # Les pushs via GITHUB_TOKEN ne déclenchent pas d'autres workflows :
      # on lance donc explicitement le déploiement puis l'auto-post social.
      - name: Déclencher déploiement + social
        if: steps.commit.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          sleep 90
          gh workflow run social.yml --ref main
